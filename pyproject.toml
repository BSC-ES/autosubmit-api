[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "autosubmit-api"
dynamic = ["version"]
description = "An extension to the Autosubmit package that serves its information as an API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Barcelona Supercomputing Center (BSC-CNS) - Earth Sciences Department", email = "support-autosubmit@bsc.es" },
]
keywords = ["autosubmit", "API"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux"
]

dependencies = [
    "fastapi[all]==0.161.1",
    "pyjwt>=2.8,<2.16",
    # requests upper bound mirrors autosubmit's requests upper bound.
    # Review the dependency version once autosubmit is updated.
    "requests>=2.31.0,<2.33.0",
    "bscearth.utils~=0.5.2",
    "pydotplus~=2.0.2",
    "portalocker>=2.6,<4.5",
    "networkx<=3.4.2",
    "scipy>=1.11.4,<1.16.0",
    "python-dotenv>=1.0.1,<1.3.0",
    "APScheduler>=3.10.4,<3.12.0",
    "gunicorn~=22.0.0",
    "pydantic>=2.9,<3",
    "SQLAlchemy~=2.0.23",
    "python-cas>=1.6,<1.8",
    "autosubmit~=4.1.17",
    "uvicorn>=0.36,<0.55",
    "uvicorn-worker~=0.4.0",
    "paramiko",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff==0.17.1",
    "testcontainers>=4.15.0",
    "mock",
]
postgres = ["psycopg2"]

all = [
    "autosubmit-api[test]",
    "autosubmit-api[postgres]",
]

[project.urls]
Homepage = "https://github.com/BSC-ES/autosubmit-api"
Documentation = "https://autosubmit-api.readthedocs.io/"
Repository = "https://github.com/BSC-ES/autosubmit-api"
Changelog = "https://github.com/BSC-ES/autosubmit-api/blob/main/CHANGELOG.md"
Issues = "https://github.com/BSC-ES/autosubmit-api/issues"

[project.scripts]
autosubmit_api = "autosubmit_api.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "autosubmit_api.__version__" }

[tool.setuptools.packages.find]
include = ["autosubmit_api*"]

[tool.setuptools.package-data]
# Ship the per-subpackage README.md files
"*" = ["*.md"]

# pytest.ini
[tool.pytest.ini_options]
addopts = [
    "--cov=autosubmit_api",
    "--cov-config=pyproject.toml",
    "--cov-report=html",
    "--cov-report=xml:coverage.xml",
    "-m",
    "not ssh_runner",
]
testpaths = ["tests"]
markers = [
    "ssh_runner: tests that require the SSH/Slurm container environment",
    "sqlite: tests run against the SQLite backend",
    "postgres: tests run against the PostgreSQL backend (testcontainers)",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ELLIPSIS",
]

# coverage.py
[tool.coverage.run]
omit = ["*test*.py"]

# ruff
[tool.ruff]
target-version = "py310"
